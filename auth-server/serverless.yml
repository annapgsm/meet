service: auth-server

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-central-1
  timeout: 10

  httpApi:
    cors: true

  environment:
    TICKETMASTER_API_KEY: ${file(config.json):TICKETMASTER_API_KEY}

functions:
  getEvents:
    handler: handler.getEvents
    events:
      - httpApi:
          path: /api/events
          method: GET
          