service: auth-server

provider: 
  name: aws
  runtime: nodejs18.x
  region: eu-central-1
  timeout: 30 
  environment:
  TICKETMASTER_API_KEY: ${file(config.json):TICKETMASTER_API_KEY}
functions: 
  getAuthURL:
    handler: handler.getAuthURL
    events:
      - http: 
          path: api/get-auth-url
          method: get
  getAccessToken:
    handler: handler.getAccessToken
    events:
      - http:
          path: api/token/{code}
          method: get
  getCalendarEvents:
    handler: handler.getCalendarEvents
    events:
      - http:
          path: api/get-events/{access_token}
          method: get
    getEvents:
    handler: handler.getEvents
    events:
      - http:
          path: api/events
          method: get